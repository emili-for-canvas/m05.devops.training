version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: BUILD
    dependencies: []
    task:
      jobs:
        - name: BUILD
          commands:
            - echo "JEBENI BUILD"
            - checkout
            - 'echo "DOCKER_USERNAME: "$DOCKER_USERNAME'
            - 'docker build 1-deployment -t $DOCKER_USERNAME/my-flask-image:latest'
            - docker login --username $DOCKER_USERNAME --password $DOCKER_PASSWORD
            - 'docker push $DOCKER_USERNAME/my-flask-image:latest'
      secrets:
        - name: dockerhub
  - name: KUBE
    dependencies:
      - BUILD
    task:
      jobs:
        - name: KUBERNETES YAY
          commands:
            - checkout
            - cd 1-deployment
            - kubectl create namespace g3 || true
            - kubectl config set-context --current --namespace=g3
            - kubectl apply -f deployment.yml
            - kubectl apply -f service.yml
            - kubectl rollout status deployment/flask-app
      secrets:
        - name: kubeconfig
